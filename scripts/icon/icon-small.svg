<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Pixel-aligned variant of icon.svg for 16px and 32px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d80e6"/>
      <stop offset="1" stop-color="#3349ad"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <rect x="3" y="4" width="10" height="2" rx="1" fill="#ffffff"/>
  <rect x="3" y="7" width="8" height="2" rx="1" fill="#ffffff"/>
  <rect x="3" y="10" width="9" height="2" rx="1" fill="#ffffff" fill-opacity="0.45"/>
</svg>

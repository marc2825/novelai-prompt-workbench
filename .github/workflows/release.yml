name: Release
# Publishes a GitHub Release when a vX.Y.Z tag is pushed:
#   full CI -> build ZIP -> verify contents and versions -> SHA-256 -> release with notes from CHANGELOG.md
# "Run workflow" (workflow_dispatch) is a dry run: it builds and verifies the ZIP and
# uploads it as a workflow artifact, but never creates a release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as every push/PR (unit, typecheck, build, E2E). The release cannot bypass them.
  ci:
    uses: ./.github/workflows/ci.yml

  # Builds with a read-only token: dependency and build code never sees a token that can publish.
  package:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Tagged commit must be on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::The tagged commit is not on main"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - name: Verify versions and ZIP contents
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then node scripts/verify-release.mjs --tag "$REF_NAME"; else node scripts/verify-release.mjs; fi
      - name: Release notes and metadata
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          digest=$(cut -d' ' -f1 ".output/novelai-prompt-workbench-${version}-chrome.zip.sha256")
          # upload-artifact skips dot-directories such as .output, so stage the files elsewhere.
          mkdir release-files
          cp ".output/novelai-prompt-workbench-${version}-chrome.zip" ".output/novelai-prompt-workbench-${version}-chrome.zip.sha256" release-files/
          node scripts/release-notes.mjs "$version" "$digest" > release-files/release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in 0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          cat release-files/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: release-files/

  # Only this job can write, and it runs no project code: it attaches the verified files.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the downloaded files and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          cd release
          [ "v$VERSION" = "$TAG" ] || { echo "::error::version $VERSION does not match tag $TAG"; exit 1; }
          sha256sum --check "novelai-prompt-workbench-${VERSION}-chrome.zip.sha256"
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes-file release-notes.md $flags \
            "novelai-prompt-workbench-${VERSION}-chrome.zip" "novelai-prompt-workbench-${VERSION}-chrome.zip.sha256"

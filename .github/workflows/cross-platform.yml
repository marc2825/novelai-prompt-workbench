name: Cross-platform
# Installs the release ZIP the way a user does on Windows, macOS and Linux (Playwright's Chromium:
# branded Chrome no longer loads unpacked extensions from the command line), checks restarts, the
# in-place update, and the update from the latest published release (issue #35).
# What this cannot check — the real toolbar button click, high-DPI rendering, branded Chrome,
# NovelAI — stays in docs/release-checklist.md as manual checks.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1' # weekly, Monday 04:41 UTC
  pull_request:
    branches: [main]
    paths:
      - 'wxt.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'entrypoints/**'
      - 'public/**'
      - 'scripts/release-*.mjs'
      - 'tests/e2e/release.spec.ts'
      - 'tests/e2e/extension.spec.ts'
      - '.github/workflows/cross-platform.yml'

# Read-only token. The token is used only to download the public release assets (gh release download).
permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-and-update:
    name: Install / update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Download the latest published release ZIP and verify its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "$REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then echo "No published release yet; the update-from-release test will be skipped."; exit 0; fi
          dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$dir"
          gh release download "$tag" --repo "$REPOSITORY" --pattern '*-chrome.zip' --pattern '*-chrome.zip.sha256' --dir "$dir"
          cd "$dir"
          if command -v sha256sum >/dev/null; then sha256sum --check ./*.sha256; else shasum -a 256 --check ./*.sha256; fi
          zip="$(ls "$dir"/*-chrome.zip)"
          echo "Previous release: $tag ($zip)"
          echo "PREVIOUS_RELEASE_ZIP=$zip" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps ' || '' }}chromium
      - name: Release ZIP install, restart, in-place update, update from the published release
        run: pnpm exec playwright test tests/e2e/release.spec.ts tests/e2e/extension.spec.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: test-results/
          retention-days: 7

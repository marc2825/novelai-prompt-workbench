name: Security
# Dependency audit, dependency review, secret scanning (Gitleaks) and static analysis (CodeQL).
# Kept separate from ci.yml so release.yml (which reuses ci.yml) is not slowed down or blocked
# by these scans. What runs when, the policies and how to handle a failure: docs/security.md.
on:
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token for every job; only the CodeQL job adds security-events: write to upload results.
# No secrets are used, so pull requests from forks run the same way.
permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }} # a push never replaces a pending weekly run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Known advisories in the locked dependency tree (pnpm-lock.yaml).
  # Runtime dependencies (the shipped extension) must be clean on every run.
  # Development tools are reported on pull requests and pushes but fail only scheduled and manual runs,
  # so a newly published advisory in a build tool does not block unrelated work.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      # Fails when pnpm-lock.yaml does not match package.json. The audit only needs the resolved
      # lockfile, so lifecycle scripts are skipped.
      - id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Runtime dependencies (no moderate or higher advisories allowed)
        run: |
          pnpm audit --prod --audit-level=moderate || {
            echo "::error::pnpm audit --prod failed: a runtime dependency advisory (moderate or higher) or a registry error. See docs/security.md (セキュリティ検査)."
            exit 1
          }
      - name: All dependencies including development tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if pnpm audit --audit-level=moderate; then exit 0; fi
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              echo "::error::pnpm audit failed: a dependency advisory (moderate or higher) or a registry error. See the report above and docs/security.md (セキュリティ検査)."
              exit 1 ;;
            *)
              echo "::warning::pnpm audit reported a development dependency advisory (moderate or higher) or a registry error, see above. It does not fail pull requests or pushes; the weekly run fails until it is fixed or accepted (docs/security.md)." ;;
          esac

  # Blocks pull requests that add or update a dependency (npm or GitHub Actions) with a known
  # vulnerability (any scope) or a license outside the allow-list. Uses the dependency graph API;
  # no checkout is needed for inline configuration.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          # Keep in sync with docs/security.md. MPL-2.0 is accepted for build tools only
          # (runtime dependencies are fixed to React / React DOM by tests/unit/release.test.ts).
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, MPL-2.0

  # Secret scanning over every commit of every fetched branch and tag. The pinned Gitleaks release
  # binary is verified against a SHA-256 hard-coded here and against the release's checksums file.
  # To update: change both values (docs/security.md). --redact=100 keeps secret values out of the
  # log; do not raise --log-level to debug/trace (debug messages include unredacted values).
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir/bin"
          curl -fsSL --retry 3 -o "$dir/$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$dir"
          grep -qFx "${GITLEAKS_SHA256}  ${archive}" checksums.txt || { echo "::error::Pinned SHA-256 is not the one in the release's checksums file"; exit 1; }
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C bin
          [ "$(bin/gitleaks version)" = "$GITLEAKS_VERSION" ] || { echo "::error::Unexpected Gitleaks version"; exit 1; }
          echo "$dir/bin" >> "$GITHUB_PATH"
      - name: Scan the full history
        run: |
          gitleaks git --redact=100 --verbose --no-banner --no-color --log-opts="--all" . || {
            echo "::error::Gitleaks found possible secrets (values redacted) or failed. Do not paste values anywhere; revoke/rotate first, then follow docs/security.md (セキュリティ検査)."
            exit 1
          }

  # Static analysis of the TypeScript/JavaScript sources and of the GitHub Actions workflows.
  # Alerts appear under Security > Code scanning and as the "CodeQL" check on pull requests.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the analysis (SARIF) to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
